[model]
api_base = "https://openrouter.ai/api/v1"
api_key = "sk-or-your-api-key"
model = "google/gemini-2.5-flash-lite"
timeout = 300
# 可选：可强制要求模型返回结构化 JSON（如 OpenAI 风格）
# 也可写成 response_format = "json_object"
response_format = { type = "json_object" }

# OpenRouter provider 路由（可选）
# 只允许指定供应商（例如只走 Azure）:
# provider_only = ["azure"]
# 配合 only 时建议禁用 fallback，避免路由到未指定 provider：
# provider_allow_fallbacks = false
# 可选：显式 provider 顺序
# provider_order = ["azure"]
# 排除某些供应商:
# provider_ignore = ["anthropic"]
# 仅路由到支持请求参数的 provider
# provider_require_parameters = true
# provider 数据策略：allow / deny
# provider_data_collection = "deny"
# 仅使用 ZDR 端点
# provider_zdr = true
# 路由排序：price / throughput / latency
# provider_sort = "throughput"

[processing]
# chunk_size 控制单次 LLM 处理的文本量（token 近似值）。
# 对 .srt 字幕文件：值越大，单次处理行数越多，容易出现“目录式”过度概括输出。
# 建议值：10000~60000。若字幕文件太长建议从 60000 往下调试，
# 观察 cleaned 文件头部“最终处理分块数”和 structured 质量。
chunk_size = 60000
# LLM 调用失败时的最大重试次数（429/5xx/网络错误）
max_retries = 3
# 全局 LLM 并发闸门（跨文件统一限流）
max_llm_concurrency = 8
